name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Create Android Platform
        run: flutter create . --project-name electricity_audit --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Gradle Repositories
        run: |
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/build.gradle.kts || true
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/settings.gradle.kts || true

      # ✨ الخطوة السحرية: تحديث Kotlin و compileSdk و AGP ✨
      - name: Update Kotlin and Android SDK Versions
        run: |
          # تحديث إصدار Kotlin إلى 2.0.0 في ملف settings.gradle.kts
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.0"/' android/settings.gradle.kts || true
          
          # تحديث إصدار AGP إلى 8.3.0
          sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.3.0"/' android/settings.gradle.kts || true
          
          # تحديث إصدار Kotlin في build.gradle.kts (للمشاريع القديمة)
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/' android/build.gradle.kts || true

          # تحديث compileSdk إلى 35
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle.kts || true
          
          # تحديث minSdk إلى 24 (متوافق مع compileSdk 35)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle.kts || true

      - name: Disable Minify and Shrink Resources
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts || true
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle.kts || true
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle.kts || true

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
