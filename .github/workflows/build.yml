name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Create Android Platform
        run: flutter create . --project-name electricity_audit --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Gradle Repositories
        run: |
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/build.gradle.kts || true
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/settings.gradle.kts || true

      - name: Update Min SDK and Compile SDK
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts || true

      # ✨ الخطوة الجديدة لحل مشكلة إصدار Kotlin ✨
      - name: Update Kotlin Version
        run: |
          # تحديث إصدار Kotlin في ملف build.gradle.kts
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle.kts || true
          # تحديث إصدار Kotlin في ملف settings.gradle.kts إذا وجد
          sed -i 's/org.jetbrains.kotlin.android.*version.*/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle.kts || true

      - name: Disable Minify and Shrink Resources
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts || true
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle.kts || true
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle.kts || true

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
