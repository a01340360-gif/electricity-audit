name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: |
          mkdir -p /tmp/mysrc
          cp -r lib /tmp/mysrc/ 2>/dev/null || true
          cp pubspec.yaml /tmp/mysrc/ 2>/dev/null || true
          
          cd /tmp
          flutter create --org com.alasema --project-name electricity_audit temp_app
          
          cp -r /tmp/temp_app/android $GITHUB_WORKSPACE/
          cp /tmp/temp_app/.metadata $GITHUB_WORKSPACE/ 2>/dev/null || true
          
          cd $GITHUB_WORKSPACE
          rm -rf lib
          cp -r /tmp/mysrc/lib .
          cp /tmp/mysrc/pubspec.yaml .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electricity-audit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
