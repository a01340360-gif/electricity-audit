name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0' # إصدار مستقر ومتوافق

      # 1. إنشاء المشروع وتحديد إصدارات Kotlin و AGP من البداية
      - name: Create Android Platform
        run: flutter create . --project-name electricity_audit --platforms=android --kotlin-version 2.0.0 --android-gradle-plugin-version 8.5.0

      - name: Install dependencies
        run: flutter pub get

      # 2. إصلاح مستودعات Gradle
      - name: Fix Gradle Repositories
        run: |
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/build.gradle.kts || true
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/settings.gradle.kts || true

      # 3. ضبط إصدارات SDK
      - name: Update Min and Compile SDK
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts || true

      # 4. تعطيل تصغير الكود لضمان البناء
      - name: Disable Minify and Shrink Resources
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts || true
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle.kts || true
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle.kts || true

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
