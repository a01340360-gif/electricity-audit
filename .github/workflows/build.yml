name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Create Android Platform
        run: flutter create . --project-name electricity_audit --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Gradle Repositories
        run: |
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/build.gradle.kts || true
          sed -i 's/repositories {/repositories { google(); mavenCentral(); maven { url = uri("https:\/\/jitpack.io") } /g' android/settings.gradle.kts || true

      # ✨ التعديل الجوهري: ضبط إصدارات Kotlin و AGP بشكل متوافق ✨
      - name: Set Compatible Kotlin and AGP Versions
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.20"/' android/settings.gradle.kts || true
          sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.1.1"/' android/settings.gradle.kts || true

      - name: Update Min and Compile SDK
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts || true

      - name: Disable Minify and Shrink Resources
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts || true
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle.kts || true
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle.kts || true

      # ✨ إجبار Gradle Wrapper على استخدام إصدار متوافق ✨
      - name: Set Gradle Wrapper Version
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.1.1-all.zip|' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
