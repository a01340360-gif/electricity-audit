name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: |
          # إنشاء مشروع فلاتر مؤقت
          cd /tmp
          flutter create --org com.alasema --project-name electricity_audit temp_app
          
          # نسخ مجلد android الأساسي إلى مستودعك
          cp -r /tmp/temp_app/android $GITHUB_WORKSPACE/
          cp /tmp/temp_app/.metadata $GITHUB_WORKSPACE/ 2>/dev/null || true
          
          # نقل ملف main.dart الذي رفعته إلى مجلد lib
          cd $GITHUB_WORKSPACE
          mkdir -p lib
          if [ -f "main.dart" ]; then mv main.dart lib/main.dart; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electricity-audit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
